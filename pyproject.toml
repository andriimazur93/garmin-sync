[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "garmin-sync"
version = "0.1.1"
description = "Self-hosted personal music synchronization for Garmin watches"
license = {file = "LICENSE"}
authors = [{name = "Local Music Sync contributors"}]
requires-python = ">=3.12"
dependencies = ["fastapi>=0.162,<0.163", "uvicorn>=0.54,<0.55"]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "httpx>=0.28,<0.29", "httpx2>=2.16,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
garmin_sync = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
