name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server tests and package
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements-build.lock
          python -m pip install --no-build-isolation -r requirements-dev.lock

      - name: Run server test suite
        run: python -m pytest -q

      - name: Build Python wheel
        run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .

      - name: Build container image
        run: docker build --tag garmin-sync:ci .

      - name: Upload Python wheel
        uses: actions/upload-artifact@v7
        with:
          name: garmin-sync-python-wheel
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14
